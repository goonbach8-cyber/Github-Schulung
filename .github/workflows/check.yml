name: Check training site
on:
  pull_request:
    branches: [main]
  push:
    branches: [m219-schulungsunterlagen]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
